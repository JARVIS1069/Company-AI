<svg viewBox="0 0 960 900" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#3e8e8a"/>
</marker>
</defs>

<rect width="960" height="900" fill="#12161d"/>

<text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#e7e2d6" letter-spacing="1">COMPANY AI — SYSTEM ARCHITECTURE</text>
<text x="480" y="66" text-anchor="middle" font-size="13" fill="#9aa2ad" letter-spacing="2">MULTI-AGENT ORG · DEMAND FORECASTING &amp; INVENTORY OPTIMIZATION</text>

<!-- Browser -->
<rect x="380" y="96" width="200" height="50" rx="6" fill="#1e2530" stroke="#313b48" stroke-width="1.5"/>
<text x="480" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#e7e2d6">Browser</text>

<line x1="480" y1="146" x2="480" y2="176" stroke="#3e8e8a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Frontend -->
<rect x="330" y="178" width="300" height="70" rx="6" fill="#1e2530" stroke="#3e8e8a" stroke-width="1.5"/>
<text x="480" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#e7e2d6">Frontend — React + Vite</text>
<text x="480" y="228" text-anchor="middle" font-size="11.5" fill="#9aa2ad">Org chart · Pipeline timeline · Quality gates · Audit log</text>

<line x1="480" y1="248" x2="480" y2="278" stroke="#3e8e8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="266" font-size="11" fill="#9aa2ad">HTTP / REST (fetch)</text>

<!-- Backend outer -->
<rect x="130" y="280" width="700" height="180" rx="8" fill="#1e2530" stroke="#e8871e" stroke-width="1.5"/>
<text x="480" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#e7e2d6">Backend — FastAPI</text>
<text x="480" y="326" text-anchor="middle" font-size="11.5" fill="#9aa2ad">/org · /kickoff · /audit-log · /message · /history</text>

<rect x="160" y="344" width="200" height="90" rx="5" fill="#12161d" stroke="#313b48" stroke-width="1.2"/>
<text x="260" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e2d6">Event Bus</text>
<text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#9aa2ad">In-memory pub/sub</text>
<text x="260" y="406" text-anchor="middle" font-size="10.5" fill="#9aa2ad">for agent handoffs</text>

<rect x="380" y="344" width="200" height="90" rx="5" fill="#12161d" stroke="#313b48" stroke-width="1.2"/>
<text x="480" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e2d6">RBAC / Permissions</text>
<text x="480" y="390" text-anchor="middle" font-size="10.5" fill="#9aa2ad">Role → allowed-action</text>
<text x="480" y="406" text-anchor="middle" font-size="10.5" fill="#9aa2ad">whitelist, checked on send</text>

<rect x="600" y="344" width="200" height="90" rx="5" fill="#12161d" stroke="#313b48" stroke-width="1.2"/>
<text x="700" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e2d6">Audit Log</text>
<text x="700" y="390" text-anchor="middle" font-size="10.5" fill="#9aa2ad">Append-only trail of</text>
<text x="700" y="406" text-anchor="middle" font-size="10.5" fill="#9aa2ad">every send / receive / deny</text>

<line x1="480" y1="460" x2="480" y2="490" stroke="#3e8e8a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Agents -->
<rect x="130" y="492" width="700" height="100" rx="8" fill="#1e2530" stroke="#3e8e8a" stroke-width="1.5"/>
<text x="480" y="518" text-anchor="middle" font-size="15" font-weight="700" fill="#e7e2d6">11 Agents (all inherit from BaseAgent)</text>
<text x="480" y="542" text-anchor="middle" font-size="12" fill="#e7e2d6">President → VP → Manager → Team Lead</text>
<text x="480" y="562" text-anchor="middle" font-size="12" fill="#e7e2d6">→ {Data Engineer · Data Scientist · ML Engineer} → QA → Inventory Analyst → Reviewer → President → Release</text>

<line x1="480" y1="592" x2="480" y2="622" stroke="#3e8e8a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ML layer -->
<rect x="130" y="624" width="700" height="120" rx="8" fill="#1e2530" stroke="#313b48" stroke-width="1.5"/>
<text x="480" y="650" text-anchor="middle" font-size="15" font-weight="700" fill="#e7e2d6">ML Layer — backend/ml/</text>

<rect x="150" y="664" width="155" height="64" rx="5" fill="#12161d" stroke="#313b48"/>
<text x="227" y="690" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e7e2d6">data_prep.py</text>
<text x="227" y="706" text-anchor="middle" font-size="10" fill="#9aa2ad">Clean + feature eng.</text>

<rect x="317" y="664" width="155" height="64" rx="5" fill="#12161d" stroke="#313b48"/>
<text x="394" y="690" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e7e2d6">forecasting_model.py</text>
<text x="394" y="706" text-anchor="middle" font-size="10" fill="#9aa2ad">LightGBM training</text>

<rect x="484" y="664" width="155" height="64" rx="5" fill="#12161d" stroke="#313b48"/>
<text x="561" y="690" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e7e2d6">inventory_optimizer.py</text>
<text x="561" y="706" text-anchor="middle" font-size="10" fill="#9aa2ad">Reorder point calc</text>

<rect x="651" y="664" width="155" height="64" rx="5" fill="#12161d" stroke="#313b48"/>
<text x="728" y="690" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e7e2d6">validation.py</text>
<text x="728" y="706" text-anchor="middle" font-size="10" fill="#9aa2ad">Real QA/Reviewer checks</text>

<line x1="480" y1="744" x2="480" y2="774" stroke="#3e8e8a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Data layer -->
<rect x="230" y="776" width="500" height="90" rx="8" fill="#1e2530" stroke="#3c9a6e" stroke-width="1.5"/>
<text x="480" y="802" text-anchor="middle" font-size="15" font-weight="700" fill="#e7e2d6">Data Layer</text>

<rect x="255" y="814" width="210" height="38" rx="5" fill="#12161d" stroke="#313b48"/>
<text x="360" y="838" text-anchor="middle" font-size="11.5" fill="#e7e2d6">datasets/*.csv (sales, inventory)</text>

<rect x="495" y="814" width="210" height="38" rx="5" fill="#12161d" stroke="#313b48"/>
<text x="600" y="838" text-anchor="middle" font-size="11.5" fill="#e7e2d6">models/*.joblib (trained model)</text>

</svg>
