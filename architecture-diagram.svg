<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .box-agent { fill: #fff4e6; stroke: #ff9800; stroke-width: 2; }
      .box-core { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
      .box-data { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .text-small { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-bi { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-small); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-small" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="text" style="font-size: 18px;">Company AI — Multi-Agent Organization System Architecture</text>

  <!-- Layer 1: Browser / Frontend -->
  <rect x="450" y="60" width="300" height="60" class="box"/>
  <text x="600" y="95" class="text">Browser / React + Vite Frontend</text>

  <!-- Arrow down -->
  <path d="M 600 120 L 600 160" class="arrow"/>

  <!-- Layer 2: FastAPI Backend -->
  <rect x="400" y="160" width="400" height="70" class="box-core"/>
  <text x="600" y="185" class="text">FastAPI Backend</text>
  <text x="600" y="205" class="text-small">/org  /kickoff  /audit-log  /message  /history</text>

  <!-- Arrow down -->
  <path d="M 600 230 L 600 270" class="arrow"/>

  <!-- Layer 3: Core Components (3 columns) -->
  <!-- Event Bus -->
  <rect x="50" y="270" width="200" height="80" class="box"/>
  <text x="150" y="295" class="text">Event Bus</text>
  <text x="150" y="315" class="text-small">Async Pub/Sub</text>
  <text x="150" y="330" class="text-small">Message Queue</text>

  <!-- RBAC / Permissions -->
  <rect x="500" y="270" width="200" height="80" class="box"/>
  <text x="600" y="295" class="text">RBAC / Permissions</text>
  <text x="600" y="315" class="text-small">Role → Actions</text>
  <text x="600" y="330" class="text-small">Access Control</text>

  <!-- Audit Log -->
  <rect x="950" y="270" width="200" height="80" class="box"/>
  <text x="1050" y="295" class="text">Audit Log</text>
  <text x="1050" y="315" class="text-small">Append-only</text>
  <text x="1050" y="330" class="text-small">Timestamp Trail</text>

  <!-- Arrows from FastAPI to core components -->
  <path d="M 500 230 L 150 270" class="arrow"/>
  <path d="M 600 230 L 600 270" class="arrow"/>
  <path d="M 700 230 L 1050 270" class="arrow"/>

  <!-- Arrow down -->
  <path d="M 600 350 L 600 390" class="arrow"/>

  <!-- Layer 4: 11 Agents (showing key agents, 2 rows) -->
  <text x="600" y="375" class="text" style="font-size: 12px; font-weight: normal; fill: #666;">11 Agents (organized by role):</text>

  <!-- Row 1 -->
  <rect x="50" y="390" width="130" height="60" class="box-agent"/>
  <text x="115" y="410" class="text" style="font-size: 11px;">President</text>
  <text x="115" y="430" class="text-small">Approval</text>

  <rect x="200" y="390" width="130" height="60" class="box-agent"/>
  <text x="265" y="410" class="text" style="font-size: 11px;">VP</text>
  <text x="265" y="430" class="text-small">Planning</text>

  <rect x="350" y="390" width="130" height="60" class="box-agent"/>
  <text x="415" y="410" class="text" style="font-size: 11px;">Manager</text>
  <text x="415" y="430" class="text-small">Coordination</text>

  <rect x="500" y="390" width="130" height="60" class="box-agent"/>
  <text x="565" y="410" class="text" style="font-size: 11px;">Team Lead</text>
  <text x="565" y="430" class="text-small">Tech Approach</text>

  <rect x="650" y="390" width="130" height="60" class="box-agent"/>
  <text x="715" y="410" class="text" style="font-size: 11px;">Data Engineer</text>
  <text x="715" y="430" class="text-small">Prep Data</text>

  <rect x="800" y="390" width="130" height="60" class="box-agent"/>
  <text x="865" y="410" class="text" style="font-size: 11px;">Data Scientist</text>
  <text x="865" y="430" class="text-small">ML Models</text>

  <rect x="950" y="390" width="200" height="60" class="box-agent"/>
  <text x="1050" y="410" class="text" style="font-size: 11px;">ML Engineer + QA</text>
  <text x="1050" y="430" class="text-small">Validation & Deploy</text>

  <!-- Row 2 -->
  <rect x="50" y="470" width="130" height="60" class="box-agent"/>
  <text x="115" y="490" class="text" style="font-size: 11px;">Inventory</text>
  <text x="115" y="510" class="text-small">Analyst</text>

  <rect x="200" y="470" width="130" height="60" class="box-agent"/>
  <text x="265" y="490" class="text" style="font-size: 11px;">Reviewer</text>
  <text x="265" y="510" class="text-small">Validation</text>

  <rect x="350" y="470" width="130" height="60" class="box-agent"/>
  <text x="415" y="490" class="text" style="font-size: 11px;">Release</text>
  <text x="415" y="510" class="text-small">Deployment</text>

  <!-- Workflow pipeline below -->
  <text x="600" y="560" class="text" style="font-size: 12px; font-weight: normal; fill: #666;">Workflow Pipeline:</text>

  <!-- Pipeline boxes -->
  <rect x="50" y="575" width="100" height="50" class="box" style="fill: #e3f2fd;"/>
  <text x="100" y="605" class="text-small">Plan</text>

  <path d="M 150 600 L 190 600" class="arrow-bi"/>

  <rect x="190" y="575" width="100" height="50" class="box" style="fill: #e8f5e9;"/>
  <text x="240" y="605" class="text-small">Prep Data</text>

  <path d="M 290 600 L 330 600" class="arrow-bi"/>

  <rect x="330" y="575" width="100" height="50" class="box" style="fill: #fff3e0;"/>
  <text x="380" y="605" class="text-small">Forecast</text>

  <path d="M 430 600 L 470 600" class="arrow-bi"/>

  <rect x="470" y="575" width="100" height="50" class="box" style="fill: #f3e5f5;"/>
  <text x="520" y="605" class="text-small">Optimize</text>

  <path d="M 570 600 L 610 600" class="arrow-bi"/>

  <rect x="610" y="575" width="100" height="50" class="box" style="fill: #fce4ec;"/>
  <text x="660" y="605" class="text-small">Validate</text>

  <path d="M 710 600 L 750 600" class="arrow-bi"/>

  <rect x="750" y="575" width="100" height="50" class="box" style="fill: #f1f8e9;"/>
  <text x="800" y="605" class="text-small">Review</text>

  <path d="M 850 600 L 890 600" class="arrow-bi"/>

  <rect x="890" y="575" width="100" height="50" class="box" style="fill: #e0f2f1;"/>
  <text x="940" y="605" class="text-small">Approve</text>

  <path d="M 990 600 L 1030 600" class="arrow-bi"/>

  <rect x="1030" y="575" width="100" height="50" class="box" style="fill: #ede7f6;"/>
  <text x="1080" y="605" class="text-small">Release</text>

  <!-- ML Layer -->
  <rect x="50" y="660" width="900" height="80" class="box-data"/>
  <text x="500" y="685" class="text">ML Layer & Data Processing</text>
  <text x="500" y="705" class="text-small">Data Cleaning • Model Training (LightGBM) • Inventory Optimization • Validation (RMSE/MAE/MAPE)</text>
  <text x="500" y="720" class="text-small">Live Predictions • Performance Evaluation</text>

  <!-- Data Store -->
  <rect x="1000" y="660" width="150" height="80" class="box-data"/>
  <text x="1075" y="685" class="text">Data Store</text>
  <text x="1075" y="705" class="text-small">CSV Datasets</text>
  <text x="1075" y="720" class="text-small">Models (.joblib)</text>

  <!-- Connections from agents to ML layer -->
  <path d="M 600 450 L 500 660" class="arrow-bi" style="stroke-dasharray: 5,5;"/>

  <!-- Legend -->
  <text x="50" y="760" class="text" style="text-anchor: start; font-size: 11px; font-weight: normal;">Legend:</text>
  <rect x="50" y="770" width="15" height="15" class="box"/>
  <text x="75" y="782" class="text-small" style="text-anchor: start;">Core Services</text>

  <rect x="250" y="770" width="15" height="15" class="box-agent"/>
  <text x="275" y="782" class="text-small" style="text-anchor: start;">Agents</text>

  <rect x="450" y="770" width="15" height="15" class="box-data"/>
  <text x="475" y="782" class="text-small" style="text-anchor: start;">ML & Data</text>

  <path d="M 650 777.5 L 670 777.5" class="arrow-bi"/>
  <text x="680" y="782" class="text-small" style="text-anchor: start;">Message Flow</text>
</svg>